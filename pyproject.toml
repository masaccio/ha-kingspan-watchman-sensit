[project]
authors = [
    {name = "Jon Connell", email = "python@figsandfudge.com"},
]
description = "Kingspan Connect Sensor integration for Home Assistant"
documentation = "https://github.com/masaccio/ha-kingspan-connect-sensor/blob/main/README.md"
license = "MIT"
name = "ha-kingspan-connect-sensor"
readme = "README.md"
requires-python = ">=3.14.2"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
version = "2.0.2"
dependencies = [
  "async-timeout>=4.0.2",
  "probatio",
  "homeassistant>=2026.10.1",
  "async-property>=0.2.1",
  "asyncio>=3.4.3",
  "kingspan-connect-sensor==4.2.1",
  "mypy",
  "pylint",
]

[project.urls]
repository = "https://github.com/masaccio/ha-kingspan-connect-sensor"

[dependency-groups]
dev = [
  "aiohttp>=3.14.3",
  "datetime>=4.7",
  "mypy>=1.15.0",
  "pytest-homeassistant-custom-component",
  "pytest-mock>=3.15.1",
  "toml>=0.10.2",
  "pandas>=2.3.3",
  "ruff>=0.16.1",
  "tzlocal>=5.4.4",
  "types-toml>=0.10.8.20260518",
  "fabric>=3.2.3",
  "pre-commit>=4.7.0",
]
maxcov = [
  "pytest-maxcov"
]

[tool.coverage.run]
branch = true

[tool.coverage.html]
directory = "coverage_html_report"

[tool.pytest.ini_options]
addopts = "-W ignore::DeprecationWarning --cov-report=html --cov-report=term-missing:skip-covered --cov-context=test --cov=custom_components/kingspan_watchman_sensit --disable-socket --allow-unix-socket"
minversion = 6.0
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
files = ["custom_components/kingspan_watchman_sensit"]

[[tool.mypy.overrides]]
module = [
  "connectsensor.*",
  "fabric.*"
]
ignore_missing_imports = true

[tool.isort]
profile = "black"

[tool.ruff]
exclude = [
  # Machine-generated files
  ".tox/*"
]
fix = true
lint.ignore = [
  "PLR2004", # Allow constant values
]
lint.select = [
  # Pyflakes including bugbears
  "F",
  "B", # Pycodestyle
  "E",
  "W", # isort
  "I", # PEP naming
  "N", # pyupgrade
  "UP", # Pylama
  "PL",
]
lint.unfixable = [
  "ERA", # do not autoremove commented out code
]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pylint]
max-statements = 100
max-branches = 20

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
