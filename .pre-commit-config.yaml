repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [ --config, pyproject.toml, --fix ]
        files: ^(custom_components|maintenance)/

  - repo: https://github.com/pylint-dev/pylint
    rev: v4.1.3
    hooks:
      - id: pylint
        args: [ --rcfile, pyproject.toml ]
        files: ^(custom_components|maintenance)/
        additional_dependencies: [ homeassistant==2026.10.2, kingspan-connect-sensor, fabric, toml ]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: [ --config-file, pyproject.toml ]
        files: ^(custom_components|maintenance)/
        additional_dependencies: [ homeassistant==2026.10.2, kingspan-connect-sensor, fabric, toml, types-toml ]
